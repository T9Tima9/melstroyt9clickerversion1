<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mellstroy Burmalda Clicker Deluxe</title>
    <style>
        :root {
            --bg-color: #080810;
            --card-bg: rgba(18, 18, 32, 0.85);
            --neon-pink: #ff007f;
            --neon-green: #00ff66;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffea00;
            --neon-purple: #b026ff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 127, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.1) 0%, transparent 40%);
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 98%;
            max-width: 1280px;
            height: 92vh;
            padding: 15px;
        }

        /* Игровая зона */
        .game-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .score-board {
            text-align: center;
        }

        .score-board h1 {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
        }

        .score-board p {
            font-size: 1rem;
            color: var(--neon-cyan);
            margin-top: 4px;
        }

        .click-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .mell-avatar-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-cyan), var(--neon-yellow));
            box-shadow: 0 0 30px var(--neon-pink);
            animation: pulse-glow 3s infinite alternate;
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .mell-avatar-wrapper:active {
            transform: scale(0.93);
        }

        .mell-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-color);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px var(--neon-pink); }
            100% { box-shadow: 0 0 40px var(--neon-purple), 0 0 60px var(--neon-cyan); }
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 1.6rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
            pointer-events: none;
            animation: floatUp 0.8s forwards ease-out;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }

        /* Правая функциональная зона */
        .right-zone {
            flex: 1.3;
            background: var(--card-bg);
            border: 2px solid var(--neon-pink);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .tab-content.active {
            display: block;
        }

        .tab-content::-webkit-scrollbar {
            width: 5px;
        }
        .tab-content::-webkit-scrollbar-thumb {
            background: var(--neon-pink);
            border-radius: 10px;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #ff3333;
            color: #fff;
        }

        .card-item {
            background: rgba(30, 30, 50, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h4 {
            font-size: 0.95rem;
            color: #fff;
        }

        .card-info p {
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 2px;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-action:hover:not(:disabled) {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .btn-action:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }

        /* Банк и Крипта стили */
        .sub-section {
            background: rgba(20, 20, 35, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .sub-section h3 {
            font-size: 1rem;
            color: var(--neon-cyan);
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .input-group input {
            flex: 1;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px;
            border-radius: 6px;
        }

        select {
            background: #000;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px;
            border-radius: 6px;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                height: auto;
            }
            .game-zone, .right-zone {
                width: 100%;
                height: 500px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Левая панель: Кликер -->
    <div class="game-zone">
        <div class="score-board">
            <h1 id="score">0</h1>
            <p>Бурмалды/сек: <span id="cps">0</span></p>
            <p>Сила клика: <span id="click-power">1</span></p>
        </div>

        <div class="click-area" id="click-area">
            <div class="mell-avatar-wrapper" id="mell-btn">
                <img src="image.jpg" alt="Мелстрой" class="mell-avatar" id="mell-img">
            </div>
        </div>
    </div>

    <!-- Правая панель: Вкладки -->
    <div class="right-zone">
        <div class="shop-header">
            <div style="font-weight: bold; color: var(--neon-pink);" id="timer-info">Цены крипты через: 30s</div>
            <button class="reset-btn" id="reset-btn">Сброс</button>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('shop')">Шоп</button>
            <button class="tab-btn" onclick="switchTab('crypto')">Крипта</button>
            <button class="tab-btn" onclick="switchTab('bank')">Банк</button>
            <button class="tab-btn" onclick="switchTab('business')">Бизнес</button>
        </div>

        <!-- ВКЛАДКА: МАГАЗИН -->
        <div id="tab-shop" class="tab-content active"></div>

        <!-- ВКЛАДКА: КРИПТА -->
        <div id="tab-crypto" class="tab-content"></div>

        <!-- ВКЛАДКА: БАНК -->
        <div id="tab-bank" class="tab-content">
            <div class="sub-section">
                <h3>Вклад (5% каждые 30 сек)</h3>
                <p>На вкладе: <b id="deposit-amount" style="color:var(--neon-green)">0</b> 💰</p>
                <div class="input-group">
                    <input type="number" id="deposit-input" placeholder="Сумма" min="1">
                    <button class="btn-action" onclick="depositMoney()">Внести</button>
                    <button class="btn-action" onclick="withdrawMoney()">Снять все</button>
                </div>
            </div>

            <div class="sub-section">
                <h3>Взять Кредит (макс x5 от баланса)</h3>
                <p>Дог к выплате: <b id="loan-amount" style="color:#ff3333">0</b> 💰</p>
                <p id="loan-timer-text" style="font-size: 0.8rem; color: var(--neon-yellow)"></p>
                <div class="input-group" style="margin-top:6px;">
                    <input type="number" id="loan-input" placeholder="Сумма" min="1">
                    <select id="loan-term">
                        <option value="1">1 мин (+5%)</option>
                        <option value="3">3 мин (+10%)</option>
                        <option value="5">5 мин (+15%)</option>
                        <option value="10">10 мин (+25%)</option>
                    </select>
                </div>
                <div class="input-group">
                    <button class="btn-action" onclick="takeLoan()" style="flex:1">Взять кредит</button>
                    <button class="btn-action" onclick="payLoan()" style="flex:1">Погасить долг</button>
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА: БИЗНЕС -->
        <div id="tab-business" class="tab-content"></div>
    </div>
</div>

<script>
    let isResetting = false;

    // Игровой баланс и характеристики
    let score = 0;
    let clickPower = 1;
    let autoCps = 0;

    let mellLevel = 1;
    let mellCost = 10;
    
    let autoLevel = 0;
    let autoCost = 15;

    // Аватарки 1..9
    const mellAvatars = [
        "image.jpg", "image2.jpg", "image3.jpg", "image4.jpg", "image5.jpg",
        "image6.jpg", "image7.jpg", "image8.jpg", "image9.jpg"
    ];

    // 10 Уникальных товаров в магазине
    let shopItems = [
        { id: 'item1', name: 'Чат-бот с цитатами', cost: 50, cps: 2, count: 0, desc: '+2 Бурмалды/сек' },
        { id: 'item2', name: 'Стримерская комната', cost: 250, cps: 8, count: 0, desc: '+8 Бурмалды/сек' },
        { id: 'item3', name: 'VIP-подписка Kick', cost: 1000, cps: 30, count: 0, desc: '+30 Бурмалды/сек' },
        { id: 'item4', name: 'Контракт с Мелстроем', cost: 4000, cps: 110, count: 0, desc: '+110 Бурмалды/сек' },
        { id: 'item5', name: 'Студия подкастов', cost: 15000, cps: 380, count: 0, desc: '+380 Бурмалды/сек' },
        { id: 'item6', name: 'Флот Ламборгини', cost: 50000, cps: 1200, count: 0, desc: '+1200 Бурмалды/сек' },
        { id: 'item7', name: 'Личный остров на Бали', cost: 200000, cps: 4500, count: 0, desc: '+4500 Бурмалды/сек' },
        { id: 'item8', name: 'Космический стрим', cost: 750000, cps: 15000, count: 0, desc: '+15000 Бурмалды/сек' },
        { id: 'item9', name: 'Майнинг-центр Мела', cost: 2500000, cps: 50000, count: 0, desc: '+50000 Бурмалды/сек' },
        { id: 'item10', name: 'Метавселенная Бурмалды', cost: 10000000, cps: 180000, count: 0, desc: '+180000 Бурмалды/сек' }
    ];

    // Криптовалюты
    let cryptos = [
        { id: 'btc', name: 'Bitcoin (BTC)', min: 10000, max: 10000000, price: 500000, owned: 0 },
        { id: 'mell', name: 'MellCoin (MELL)', min: 100000, max: 50000000, price: 2000000, owned: 0 },
        { id: 'burm', name: 'Burmalda Token (BURM)', min: 1000000, max: 200000000, price: 15000000, owned: 0 }
    ];

    // Банк
    let bankDeposit = 0;
    let bankLoan = 0;
    let loanEndTime = 0;

    // Бизнесы
    let businesses = [
        { id: 'b1', name: 'Компьютерный Клуб', cost: 50000, cps: 1500, bought: false },
        { id: 'b2', name: 'Сеть Барбершопов', cost: 500000, cps: 12000, bought: false },
        { id: 'b3', name: 'Элитное Казино', cost: 5000000, cps: 100000, bought: false }
    ];

    let cryptoTimer = 30;

    // Переключение вкладок
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        event.target.classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    // Расчет CPS
    function recalculateCps() {
        let total = autoLevel * 1;
        shopItems.forEach(i => total += i.count * i.cps);
        businesses.forEach(b => { if (b.bought) total += b.cps; });
        autoCps = total;
    }

    // Сохранение и Загрузка
    function saveGame() {
        if (isResetting) return;
        const data = {
            score, clickPower, mellLevel, mellCost, autoLevel, autoCost,
            shopItems: shopItems.map(i => ({ id: i.id, count: i.count, cost: i.cost })),
            cryptos: cryptos.map(c => ({ id: c.id, price: c.price, owned: c.owned })),
            bankDeposit, bankLoan, loanEndTime,
            businesses: businesses.map(b => ({ id: b.id, bought: b.bought }))
        };
        localStorage.setItem('mellstroy_clicker_v2', JSON.stringify(data));
    }

    function loadGame() {
        const saved = localStorage.getItem('mellstroy_clicker_v2');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                score = Number(data.score) || 0;
                clickPower = Number(data.clickPower) || 1;
                mellLevel = Number(data.mellLevel) || 1;
                mellCost = Number(data.mellCost) || 10;
                autoLevel = Number(data.autoLevel) || 0;
                autoCost = Number(data.autoCost) || 15;
                bankDeposit = Number(data.bankDeposit) || 0;
                bankLoan = Number(data.bankLoan) || 0;
                loanEndTime = Number(data.loanEndTime) || 0;

                if (data.shopItems) {
                    data.shopItems.forEach(s => {
                        let item = shopItems.find(i => i.id === s.id);
                        if (item) { item.count = s.count; item.cost = s.cost; }
                    });
                }
                if (data.cryptos) {
                    data.cryptos.forEach(c => {
                        let crypto = cryptos.find(cr => cr.id === c.id);
                        if (crypto) { crypto.price = c.price; crypto.owned = c.owned; }
                    });
                }
                if (data.businesses) {
                    data.businesses.forEach(b => {
                        let biz = businesses.find(bz => bz.id === b.id);
                        if (biz) { biz.bought = b.bought; }
                    });
                }
                recalculateCps();
            } catch(e) { console.error(e); }
        }
    }

    // Элементы
    const scoreEl = document.getElementById('score');
    const cpsEl = document.getElementById('cps');
    const clickPowerEl = document.getElementById('click-power');
    const mellBtn = document.getElementById('mell-btn');
    const mellImg = document.getElementById('mell-img');
    const clickArea = document.getElementById('click-area');

    // Клик
    mellBtn.addEventListener('click', (e) => {
        score += clickPower;
        updateUI();
        createFloatingText(e, `+${clickPower}`);
    });

    function createFloatingText(e, text) {
        const rect = clickArea.getBoundingClientRect();
        const x = e.clientX - rect.left - 20;
        const y = e.clientY - rect.top - 20;

        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        clickArea.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    // Рендер Шопа
    function renderShop() {
        const container = document.getElementById('tab-shop');
        container.innerHTML = '';

        // Прокачка клика (коэффициент удорожания снижен до 1.35)
        const mellItem = document.createElement('div');
        mellItem.className = 'card-item';
        mellItem.innerHTML = `
            <div class="card-info">
                <h4>Прокачать Мелстроя (Ур. ${mellLevel})</h4>
                <p>Клик даёт +${mellLevel + 1}</p>
            </div>
            <button class="btn-action" id="buy-mell" ${score < mellCost ? 'disabled' : ''}>
                ${Math.floor(mellCost)} 💰
            </button>
        `;
        container.appendChild(mellItem);

        document.getElementById('buy-mell').onclick = () => {
            if (score >= mellCost) {
                score -= mellCost;
                mellLevel++;
                clickPower = mellLevel;
                mellCost = Math.floor(mellCost * 1.35); // Плавное подорожание!
                updateAvatar();
                renderShop();
                updateUI();
                saveGame();
            }
        };

        // Авто-ферма
        const autoItem = document.createElement('div');
        autoItem.className = 'card-item';
        autoItem.innerHTML = `
            <div class="card-info">
                <h4>Авто-ферма (Ур. ${autoLevel})</h4>
                <p>Добыча +1 Бурмалда/сек</p>
            </div>
            <button class="btn-action" id="buy-auto" ${score < autoCost ? 'disabled' : ''}>
                ${Math.floor(autoCost)} 💰
            </button>
        `;
        container.appendChild(autoItem);

        document.getElementById('buy-auto').onclick = () => {
            if (score >= autoCost) {
                score -= autoCost;
                autoLevel++;
                autoCost = Math.floor(autoCost * 1.4);
                recalculateCps();
                renderShop();
                updateUI();
                saveGame();
            }
        };

        // 10 уникальных предметов
        shopItems.forEach(item => {
            const div = document.createElement('div');
            div.className = 'card-item';
            div.innerHTML = `
                <div class="card-info">
                    <h4>${item.name} (${item.count})</h4>
                    <p>${item.desc}</p>
                </div>
                <button class="btn-action" id="buy-${item.id}" ${score < item.cost ? 'disabled' : ''}>
                    ${Math.floor(item.cost)} 💰
                </button>
            `;
            container.appendChild(div);

            document.getElementById(`buy-${item.id}`).onclick = () => {
                if (score >= item.cost) {
                    score -= item.cost;
                    item.count++;
                    item.cost = Math.floor(item.cost * 1.4);
                    recalculateCps();
                    renderShop();
                    updateUI();
                    saveGame();
                }
            };
        });
    }

    // Рендер Крипты
    function renderCrypto() {
        const container = document.getElementById('tab-crypto');
        container.innerHTML = '';

        cryptos.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card-item';
            div.innerHTML = `
                <div class="card-info">
                    <h4>${c.name}</h4>
                    <p>Курс: <b style="color:var(--neon-yellow)">${c.price.toLocaleString()}</b> 💰</p>
                    <p>В наличии: <b>${c.owned}</b></p>
                </div>
                <div style="display:flex; gap:4px;">
                    <button class="btn-action" onclick="buyCrypto('${c.id}')">Купить</button>
                    <button class="btn-action" onclick="sellCrypto('${c.id}')">Продать</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function buyCrypto(id) {
        let c = cryptos.find(cr => cr.id === id);
        if (score >= c.price) {
            score -= c.price;
            c.owned++;
            renderCrypto();
            updateUI();
            saveGame();
        }
    }

    function sellCrypto(id) {
        let c = cryptos.find(cr => cr.id === id);
        if (c.owned > 0) {
            c.owned--;
            score += c.price;
            renderCrypto();
            updateUI();
            saveGame();
        }
    }

    // Обновление курса крипты раз в 30 секунд
    function updateCryptoPrices() {
        cryptos.forEach(c => {
            c.price = Math.floor(Math.random() * (c.max - c.min + 1)) + c.min;
        });
        renderCrypto();
    }

    // Банковские функции
    function depositMoney() {
        const input = document.getElementById('deposit-input');
        const val = Math.floor(Number(input.value));
        if (val > 0 && score >= val) {
            score -= val;
            bankDeposit += val;
            input.value = '';
            updateUI();
            saveGame();
        }
    }

    function withdrawMoney() {
        if (bankDeposit > 0) {
            score += bankDeposit;
            bankDeposit = 0;
            updateUI();
            saveGame();
        }
    }

    function takeLoan() {
        if (bankLoan > 0) {
            alert("Сначала погасите существующий кредит!");
            return;
        }
        const input = document.getElementById('loan-input');
        const termSelect = document.getElementById('loan-term');
        const amount = Math.floor(Number(input.value));
        const maxLoan = Math.max(1000, score * 5); // До х5 от суммы

        if (amount <= 0 || amount > maxLoan) {
            alert(`Максимальный кредит: ${maxLoan} 💰`);
            return;
        }

        const term = Number(termSelect.value);
        let percent = 0.05;
        if (term === 3) percent = 0.10;
        if (term === 5) percent = 0.15;
        if (term === 10) percent = 0.25;

        bankLoan = Math.floor(amount * (1 + percent));
        score += amount;
        loanEndTime = Date.now() + (term * 60 * 1000);
        input.value = '';
        updateUI();
        saveGame();
    }

    function payLoan() {
        if (bankLoan > 0 && score >= bankLoan) {
            score -= bankLoan;
            bankLoan = 0;
            loanEndTime = 0;
            updateUI();
            saveGame();
        }
    }

    // Рендер Бизнесов
    function renderBusiness() {
        const container = document.getElementById('tab-business');
        container.innerHTML = '';

        businesses.forEach(b => {
            const div = document.createElement('div');
            div.className = 'card-item';
            div.innerHTML = `
                <div class="card-info">
                    <h4>${b.name} ${b.bought ? '(Куплено)' : ''}</h4>
                    <p>Прибыль: +${b.cps} Бурмалды/сек</p>
                </div>
                <button class="btn-action" onclick="buyBusiness('${b.id}')" ${b.bought || score < b.cost ? 'disabled' : ''}>
                    ${b.bought ? 'Владелец' : b.cost + ' 💰'}
                </button>
            `;
            container.appendChild(div);
        });
    }

    function buyBusiness(id) {
        let b = businesses.find(bz => bz.id === id);
        if (!b.bought && score >= b.cost) {
            score -= b.cost;
            b.bought = true;
            recalculateCps();
            renderBusiness();
            updateUI();
            saveGame();
        }
    }

    // Правильное вращение аватарок 1..9 по кругу
    function updateAvatar() {
        const index = (mellLevel - 1) % mellAvatars.length;
        mellImg.src = mellAvatars[index];
    }

    function updateUI() {
        scoreEl.innerText = Math.floor(score);
        cpsEl.innerText = autoCps;
        clickPowerEl.innerText = clickPower;

        document.getElementById('deposit-amount').innerText = Math.floor(bankDeposit).toLocaleString();
        document.getElementById('loan-amount').innerText = Math.floor(bankLoan).toLocaleString();

        // Таймер кредита
        if (bankLoan > 0 && loanEndTime > 0) {
            let leftSec = Math.max(0, Math.floor((loanEndTime - Date.now()) / 1000));
            document.getElementById('loan-timer-text').innerText = `Осталось времени: ${leftSec} сек.`;
            if (leftSec === 0) {
                // Принудительное списание если срок вышел
                score = Math.max(0, score - bankLoan);
                bankLoan = 0;
                loanEndTime = 0;
            }
        } else {
            document.getElementById('loan-timer-text').innerText = '';
        }

        renderShop();
        renderCrypto();
        renderBusiness();
    }

    // Сброс
    document.getElementById('reset-btn').onclick = () => {
        if (confirm("Вы точно хотите сбросить весь прогресс?")) {
            isResetting = true;
            localStorage.removeItem('mellstroy_clicker_v2');
            location.reload();
        }
    };

    // Инициализация
    loadGame();
    updateAvatar();
    updateUI();

    // Таймер авто-дохода и 30-секундный цикл
    setInterval(() => {
        if (autoCps > 0) {
            score += autoCps;
        }

        // Таймер обновления крипты и процента по вкладам (раз в 30 секунд)
        cryptoTimer--;
        if (cryptoTimer <= 0) {
            cryptoTimer = 30;
            updateCryptoPrices();

            if (bankDeposit > 0) {
                bankDeposit = Math.floor(bankDeposit * 1.05); // 5% на вклад каждые 30 сек
            }
        }
        document.getElementById('timer-info').innerText = `Крипта/Вклад через: ${cryptoTimer}s`;

        updateUI();
    }, 1000);

    // Автосохранение
    setInterval(saveGame, 3000);
    window.addEventListener('beforeunload', saveGame);
</script>
</body>
</html>
