<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mellstroy Burmalda Clicker Deluxe</title>
    <style>
        :root {
            --bg-color: #080810;
            --card-bg: rgba(18, 18, 32, 0.85);
            --neon-pink: #ff007f;
            --neon-green: #00ff66;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffea00;
            --neon-purple: #b026ff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 127, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.1) 0%, transparent 40%);
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 98%;
            max-width: 1280px;
            height: 92vh;
            padding: 15px;
        }

        /* Игровая зона */
        .game-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .score-board {
            text-align: center;
            width: 100%;
        }

        .score-board h1 {
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-green);
        }

        .currencies {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .currency-item {
            font-size: 0.9rem;
            color: var(--neon-cyan);
        }

        .currency-item b {
            color: #fff;
        }

        .click-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .mell-avatar-wrapper {
            position: relative;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-cyan), var(--neon-yellow));
            box-shadow: 0 0 30px var(--neon-pink);
            animation: pulse-glow 3s infinite alternate;
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .mell-avatar-wrapper:active {
            transform: scale(0.93);
        }

        .mell-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-color);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px var(--neon-pink); }
            100% { box-shadow: 0 0 40px var(--neon-purple), 0 0 60px var(--neon-cyan); }
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 1.6rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
            pointer-events: none;
            animation: floatUp 0.8s forwards ease-out;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }

        /* Правая зона */
        .right-zone {
            flex: 1.3;
            background: var(--card-bg);
            border: 2px solid var(--neon-pink);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .tab-content.active {
            display: block;
        }

        .tab-content::-webkit-scrollbar {
            width: 5px;
        }
        .tab-content::-webkit-scrollbar-thumb {
            background: var(--neon-pink);
            border-radius: 10px;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #ff3333;
            color: #fff;
        }

        .card-item {
            background: rgba(30, 30, 50, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h4 {
            font-size: 0.95rem;
            color: #fff;
        }

        .card-info p {
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 2px;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-action:hover:not(:disabled) {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .btn-action:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }

        .sub-section {
            background: rgba(20, 20, 35, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .sub-section h3 {
            font-size: 1rem;
            color: var(--neon-cyan);
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .input-group input {
            flex: 1;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px;
            border-radius: 6px;
        }

        select {
            background: #000;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px;
            border-radius: 6px;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                height: auto;
            }
            .game-zone, .right-zone {
                width: 100%;
                height: 500px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Левая панель: Кликер -->
    <div class="game-zone">
        <div class="score-board">
            <h1 id="score">0 💰</h1>
            <div class="currencies">
                <div class="currency-item">Бурмалды/сек: <b id="cps">0</b></div>
                <div class="currency-item">Сила клика: <b id="click-power">1</b></div>
            </div>
            <div class="currencies" style="margin-top:6px;">
                <div class="currency-item">Подписчики: <b id="subs-count" style="color:var(--neon-pink)">0</b> (<span id="subs-cps">0</span>/сек)</div>
                <div class="currency-item">Доллары: <b id="dollars-count" style="color:var(--neon-green)">0 $</b></div>
            </div>
        </div>

        <div class="click-area" id="click-area">
            <div class="mell-avatar-wrapper" id="mell-btn">
                <img src="image.jpg" alt="Мелстрой" class="mell-avatar" id="mell-img">
            </div>
        </div>
    </div>

    <!-- Правая панель -->
    <div class="right-zone">
        <div class="shop-header">
            <div style="font-weight: bold; color: var(--neon-pink);" id="timer-info">Цены крипты через: 30s</div>
            <button class="reset-btn" id="reset-btn">Сброс</button>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('shop', event)">Шоп</button>
            <button class="tab-btn" onclick="switchTab('crypto', event)">Крипта</button>
            <button class="tab-btn" onclick="switchTab('bank', event)">Банк</button>
            <button class="tab-btn" onclick="switchTab('business', event)">Бизнес</button>
        </div>

        <!-- Вкладка Шоп -->
        <div id="tab-shop" class="tab-content active"></div>

        <!-- Вкладка Крипта -->
        <div id="tab-crypto" class="tab-content"></div>

        <!-- Вкладка Банк -->
        <div id="tab-bank" class="tab-content">
            <!-- Обмен Валют -->
            <div class="sub-section">
                <h3>💱 Обменник валюты в Банке</h3>
                <p style="font-size:0.8rem; color:#aaa; margin-bottom:6px;">
                    • 1,000 Подписчиков ➔ <b style="color:var(--neon-green)">1 $</b><br>
                    • 1 $ ➔ <b style="color:var(--neon-yellow)">10,000 Бурмалды</b>
                </p>
                <div class="input-group">
                    <button class="btn-action" onclick="exchangeSubsToDollars()" style="flex:1">Обменять 1000 Подписчиков на 1$</button>
                </div>
                <div class="input-group">
                    <button class="btn-action" onclick="exchangeDollarsToBurmalda()" style="flex:1">Обменять 1$ на 10,000 💰</button>
                </div>
            </div>

            <!-- Вклад -->
            <div class="sub-section">
                <h3>Вклад (5% каждые 30 сек)</h3>
                <p>На вкладе: <b id="deposit-amount" style="color:var(--neon-green)">0</b> 💰</p>
                <div class="input-group">
                    <input type="number" id="deposit-input" placeholder="Сумма" min="1">
                    <button class="btn-action" onclick="depositMoney()">Внести</button>
                    <button class="btn-action" onclick="withdrawMoney()">Снять все</button>
                </div>
            </div>

            <!-- Кредит -->
            <div class="sub-section">
                <h3>Кредит (до x5 от баланса)</h3>
                <p>Дог к выплате: <b id="loan-amount" style="color:#ff3333">0</b> 💰</p>
                <p id="loan-timer-text" style="font-size: 0.8rem; color: var(--neon-yellow)"></p>
                <div class="input-group" style="margin-top:6px;">
                    <input type="number" id="loan-input" placeholder="Сумма" min="1">
                    <select id="loan-term">
                        <option value="1">1 мин (+5%)</option>
                        <option value="3">3 мин (+10%)</option>
                        <option value="5">5 мин (+15%)</option>
                        <option value="10">10 мин (+25%)</option>
                    </select>
                </div>
                <div class="input-group">
                    <button class="btn-action" onclick="takeLoan()" style="flex:1">Взять кредит</button>
                    <button class="btn-action" onclick="payLoan()" style="flex:1; border-color:#ff3333; color:#ff3333;">Погасить долг</button>
                </div>
            </div>
        </div>

        <!-- Вкладка Бизнес -->
        <div id="tab-business" class="tab-content"></div>
    </div>
</div>

<script>
    let isResetting = false;

    // Балансы
    let score = 0;          // Бурмалды
    let subscribers = 0;    // Подписчики
    let dollars = 0;        // Доллары ($)

    let clickPower = 1;
    let autoCps = 0;        // Бурмалды/сек (ТОЛЬКО от Авто-фермы)
    let subsCps = 0;        // Подписчики/сек (от Бизнесов и бонусов)

    let mellLevel = 1;
    let mellCost = 10;
    
    let autoLevel = 0;
    let autoCost = 15;

    const mellAvatars = [
        "image.jpg", "image2.jpg", "image3.jpg", "image4.jpg", "image5.jpg",
        "image6.jpg", "image7.jpg", "image8.jpg", "image9.jpg"
    ];

    // 10 Уникальных товаров - БЕЗ Бурмалды/сек и БЕЗ силы клика
    let shopItems = [
        { id: 'item1', name: 'Мем-кампания', cost: 100, count: 0, desc: '+10 Подписчиков/сек', perk: 'subs10' },
        { id: 'item2', name: 'VIP Чат Модерация', cost: 500, count: 0, desc: '+5% к сумме с кредита', perk: 'loanBonus' },
        { id: 'item3', name: 'Инвестор-партнер', cost: 2000, count: 0, desc: 'Вклад в банке приносит +1% каждые 30 сек', perk: 'depositBonus' },
        { id: 'item4', name: 'Контракт с Kick', cost: 8000, count: 0, desc: '+100 Подписчиков/сек', perk: 'subs100' },
        { id: 'item5', name: 'PR-Агентство', cost: 25000, count: 0, desc: 'Скидка 10% на покупку всех Бизнесов', perk: 'bizDiscount' },
        { id: 'item6', name: 'Крипто-Бот', cost: 80000, count: 0, desc: '+10% к цене продажи любой криптовалюты', perk: 'cryptoBonus' },
        { id: 'item7', name: 'Дубайский офис', cost: 300000, count: 0, desc: '+1,000 Подписчиков/сек', perk: 'subs1000' },
        { id: 'item8', name: 'ИИ-Менеджер', cost: 1000000, count: 0, desc: 'Каждые 30 сек даёт бесплатно +1 $', perk: 'freeDollar' },
        { id: 'item9', name: 'Медиа-Холдинг', cost: 5000000, count: 0, desc: '+10,000 Подписчиков/сек', perk: 'subs10000' },
        { id: 'item10', name: 'Золотой Статус', cost: 20000000, count: 0, desc: 'Курс обмена: 1$ = 15,000 Бурмалды вместо 10k', perk: 'betterExchange' }
    ];

    // Криптовалюты
    let cryptos = [
        { id: 'btc', name: 'Bitcoin (BTC)', min: 10000, max: 10000000, price: 500000, owned: 0 },
        { id: 'mell', name: 'MellCoin (MELL)', min: 100000, max: 50000000, price: 2000000, owned: 0 },
        { id: 'burm', name: 'Burmalda Token (BURM)', min: 1000000, max: 200000000, price: 15000000, owned: 0 }
    ];

    // Банк
    let bankDeposit = 0;
    let bankLoan = 0;
    let loanEndTime = 0;

    // Бизнесы (Приносят ПОДПИСЧИКОВ в секунду)
    let businesses = [
        { id: 'b1', name: 'Компьютерный Клуб', cost: 50000, subCps: 50, bought: false },
        { id: 'b2', name: 'Сеть Барбершопов', cost: 500000, subCps: 600, bought: false },
        { id: 'b3', name: 'Элитное Казино', cost: 5000000, subCps: 8000, bought: false }
    ];

    let cryptoTimer = 30;

    function switchTab(tabName, event) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        if (event && event.target) {
            event.target.classList.add('active');
        }
        document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    function recalculateRates() {
        // Единственная ферма Бурмалды в секунду:
        autoCps = autoLevel * 1;

        // Подписчики в секунду
        let sCps = 0;
        businesses.forEach(b => { if (b.bought) sCps += b.subCps; });

        // Бонусы от шоп-предметов
        let item1 = shopItems.find(i => i.id === 'item1');
        if (item1) sCps += item1.count * 10;

        let item4 = shopItems.find(i => i.id === 'item4');
        if (item4) sCps += item4.count * 100;

        let item7 = shopItems.find(i => i.id === 'item7');
        if (item7) sCps += item7.count * 1000;

        let item9 = shopItems.find(i => i.id === 'item9');
        if (item9) sCps += item9.count * 10000;

        subsCps = sCps;
    }

    // Сохранение и загрузка
    function saveGame() {
        if (isResetting) return;
        const data = {
            score, subscribers, dollars, clickPower, mellLevel, mellCost, autoLevel, autoCost,
            shopItems: shopItems.map(i => ({ id: i.id, count: i.count, cost: i.cost })),
            cryptos: cryptos.map(c => ({ id: c.id, price: c.price, owned: c.owned })),
            bankDeposit, bankLoan, loanEndTime,
            businesses: businesses.map(b => ({ id: b.id, bought: b.bought }))
        };
        localStorage.setItem('mellstroy_clicker_v3', JSON.stringify(data));
    }

    function loadGame() {
        const saved = localStorage.getItem('mellstroy_clicker_v3');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                score = Number(data.score) || 0;
                subscribers = Number(data.subscribers) || 0;
                dollars = Number(data.dollars) || 0;

                clickPower = Number(data.clickPower) || 1;
                mellLevel = Number(data.mellLevel) || 1;
                mellCost = Number(data.mellCost) || 10;
                autoLevel = Number(data.autoLevel) || 0;
                autoCost = Number(data.autoCost) || 15;

                bankDeposit = Number(data.bankDeposit) || 0;
                bankLoan = Number(data.bankLoan) || 0;
                loanEndTime = Number(data.loanEndTime) || 0;

                if (data.shopItems) {
                    data.shopItems.forEach(s => {
                        let item = shopItems.find(i => i.id === s.id);
                        if (item) { item.count = s.count || 0; item.cost = s.cost || item.cost; }
                    });
                }
                if (data.cryptos) {
                    data.cryptos.forEach(c => {
                        let crypto = cryptos.find(cr => cr.id === c.id);
                        if (crypto) { crypto.price = c.price; crypto.owned = c.owned; }
                    });
                }
                if (data.businesses) {
                    data.businesses.forEach(b => {
                        let biz = businesses.find(bz => bz.id === b.id);
                        if (biz) { biz.bought = b.bought; }
                    });
                }
                recalculateRates();
            } catch(e) { console.error(e); }
        }
    }

    const scoreEl = document.getElementById('score');
    const cpsEl = document.getElementById('cps');
    const clickPowerEl = document.getElementById('click-power');
    const mellBtn = document.getElementById('mell-btn');
    const mellImg = document.getElementById('mell-img');
    const clickArea = document.getElementById('click-area');

    mellBtn.addEventListener('click', (e) => {
        score += clickPower;
        updateUI();
        createFloatingText(e, `+${clickPower}`);
    });

    function createFloatingText(e, text) {
        const rect = clickArea.getBoundingClientRect();
        const x = e.clientX - rect.left - 20;
        const y = e.clientY - rect.top - 20;

        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        clickArea.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    // Рендер Шопа
    function renderShop() {
        const container = document.getElementById('tab-shop');
        container.innerHTML = '';

        // Прокачка клика
        const mellItem = document.createElement('div');
        mellItem.className = 'card-item';
        mellItem.innerHTML = `
            <div class="card-info">
                <h4>Прокачать Мелстроя (Ур. ${mellLevel})</h4>
                <p>Увеличивает клик. Клик даёт +${mellLevel + 1}</p>
            </div>
            <button class="btn-action" id="buy-mell" ${score < mellCost ? 'disabled' : ''}>
                ${Math.floor(mellCost)} 💰
            </button>
        `;
        container.appendChild(mellItem);

        document.getElementById('buy-mell').onclick = () => {
            if (score >= mellCost) {
                score -= mellCost;
                mellLevel++;
                clickPower = mellLevel;
                mellCost = Math.floor(mellCost * 1.35);
                updateAvatar();
                renderShop();
                updateUI();
                saveGame();
            }
        };

        // Единственная ферма Бурмалды/сек
        const autoItem = document.createElement('div');
        autoItem.className = 'card-item';
        autoItem.innerHTML = `
            <div class="card-info">
                <h4>Единственная Авто-ферма (Ур. ${autoLevel})</h4>
                <p>Единственный источник добычи (+1 Бурмалда/сек)</p>
            </div>
            <button class="btn-action" id="buy-auto" ${score < autoCost ? 'disabled' : ''}>
                ${Math.floor(autoCost)} 💰
            </button>
        `;
        container.appendChild(autoItem);

        document.getElementById('buy-auto').onclick = () => {
            if (score >= autoCost) {
                score -= autoCost;
                autoLevel++;
                autoCost = Math.floor(autoCost * 1.4);
                recalculateRates();
                renderShop();
                updateUI();
                saveGame();
            }
        };

        // 10 Предметов с уникальными свойствами
        shopItems.forEach(item => {
            const div = document.createElement('div');
            div.className = 'card-item';
            div.innerHTML = `
                <div class="card-info">
                    <h4>${item.name} (${item.count})</h4>
                    <p style="color:var(--neon-cyan)">${item.desc}</p>
                </div>
                <button class="btn-action" id="buy-${item.id}" ${score < item.cost ? 'disabled' : ''}>
                    ${Math.floor(item.cost)} 💰
                </button>
            `;
            container.appendChild(div);

            document.getElementById(`buy-${item.id}`).onclick = () => {
                if (score >= item.cost) {
                    score -= item.cost;
                    item.count++;
                    item.cost = Math.floor(item.cost * 1.45);
                    recalculateRates();
                    renderShop();
                    updateUI();
                    saveGame();
                }
            };
        });
    }

    // Рендер Крипты
    function renderCrypto() {
        const container = document.getElementById('tab-crypto');
        container.innerHTML = '';

        let cryptoBonusCount = shopItems.find(i => i.id === 'item6')?.count || 0;

        cryptos.forEach(c => {
            let sellPrice = Math.floor(c.price * (1 + (cryptoBonusCount * 0.1)));

            const div = document.createElement('div');
            div.className = 'card-item';
            div.innerHTML = `
                <div class="card-info">
                    <h4>${c.name}</h4>
                    <p>Покупка: <b style="color:var(--neon-yellow)">${c.price.toLocaleString()}</b> 💰</p>
                    <p>Продажа: <b style="color:var(--neon-green)">${sellPrice.toLocaleString()}</b> 💰</p>
                    <p>В наличии: <b>${c.owned}</b></p>
                </div>
                <div style="display:flex; gap:4px;">
                    <button class="btn-action" onclick="buyCrypto('${c.id}')">Купить</button>
                    <button class="btn-action" onclick="sellCrypto('${c.id}')">Продать</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function buyCrypto(id) {
        let c = cryptos.find(cr => cr.id === id);
        if (score >= c.price) {
            score -= c.price;
            c.owned++;
            renderCrypto();
            updateUI();
            saveGame();
        }
    }

    function sellCrypto(id) {
        let c = cryptos.find(cr => cr.id === id);
        if (c.owned > 0) {
            let cryptoBonusCount = shopItems.find(i => i.id === 'item6')?.count || 0;
            let sellPrice = Math.floor(c.price * (1 + (cryptoBonusCount * 0.1)));

            c.owned--;
            score += sellPrice;
            renderCrypto();
            updateUI();
            saveGame();
        }
    }

    function updateCryptoPrices() {
        cryptos.forEach(c => {
            c.price = Math.floor(Math.random() * (c.max - c.min + 1)) + c.min;
        });
        renderCrypto();
    }

    // БАНК И ОБМЕН ВАЛЮТ
    function exchangeSubsToDollars() {
        if (subscribers >= 1000) {
            let count = Math.floor(subscribers / 1000);
            subscribers -= count * 1000;
            dollars += count;
            updateUI();
            saveGame();
        } else {
            alert("Нужно минимум 1,000 Подписчиков!");
        }
    }

    function exchangeDollarsToBurmalda() {
        if (dollars >= 1) {
            let rate = 10000;
            let hasBonus = shopItems.find(i => i.id === 'item10')?.count || 0;
            if (hasBonus > 0) rate = 15000;

            score += dollars * rate;
            dollars = 0;
            updateUI();
            saveGame();
        } else {
            alert("У вас нет $ для обмена!");
        }
    }

    function depositMoney() {
        const input = document.getElementById('deposit-input');
        const val = Math.floor(Number(input.value));
        if (val > 0 && score >= val) {
            score -= val;
            bankDeposit += val;
            input.value = '';
            updateUI();
            saveGame();
        }
    }

    function withdrawMoney() {
        if (bankDeposit > 0) {
            score += bankDeposit;
            bankDeposit = 0;
            updateUI();
            saveGame();
        }
    }

    function takeLoan() {
        if (bankLoan > 0) {
            alert("Сначала погасите существующий кредит!");
            return;
        }
        const input = document.getElementById('loan-input');
        const termSelect = document.getElementById('loan-term');
        const amount = Math.floor(Number(input.value));
        const maxLoan = Math.max(1000, score * 5);

        if (amount <= 0 || amount > maxLoan) {
            alert(`Максимальный кредит: ${maxLoan} 💰`);
            return;
        }

        const term = Number(termSelect.value);
        let percent = 0.05;
        if (term === 3) percent = 0.10;
        if (term === 5) percent = 0.15;
        if (term === 10) percent = 0.25;

        bankLoan = Math.floor(amount * (1 + percent));
        score += amount;
        loanEndTime = Date.now() + (term * 60 * 1000);
        input.value = '';
        updateUI();
        saveGame();
    }

    // Исправленная функция погашения долга!
    function payLoan() {
        if (bankLoan <= 0) {
            alert("У вас нет активного кредита!");
            return;
        }
        if (score < bankLoan) {
            alert(`Недостаточно Бурмалды! Нужно: ${bankLoan.toLocaleString()} 💰`);
            return;
        }
        
        score -= bankLoan;
        bankLoan = 0;
        loanEndTime = 0;
        alert("Поздравляем! Кредит полностью погашен.");
        updateUI();
        saveGame();
    }

    // Рендер Бизнесов
    function renderBusiness() {
        const container = document.getElementById('tab-business');
        container.innerHTML = '';

        let discountCount = shopItems.find(i => i.id === 'item5')?.count || 0;
        let discountMult = Math.max(0.2, 1 - (discountCount * 0.1));

        businesses.forEach(b => {
            let actualCost = Math.floor(b.cost * discountMult);
            const div = document.createElement('div');
            div.className = 'card-item';
            div.innerHTML = `
                <div class="card-info">
                    <h4>${b.name} ${b.bought ? '(Куплено)' : ''}</h4>
                    <p style="color:var(--neon-pink)">Прибыль: +${b.subCps.toLocaleString()} Подписчиков/сек</p>
                </div>
                <button class="btn-action" onclick="buyBusiness('${b.id}')" ${b.bought || score < actualCost ? 'disabled' : ''}>
                    ${b.bought ? 'Владелец' : actualCost.toLocaleString() + ' 💰'}
                </button>
            `;
            container.appendChild(div);
        });
    }

    function buyBusiness(id) {
        let discountCount = shopItems.find(i => i.id === 'item5')?.count || 0;
        let discountMult = Math.max(0.2, 1 - (discountCount * 0.1));

        let b = businesses.find(bz => bz.id === id);
        let actualCost = Math.floor(b.cost * discountMult);

        if (!b.bought && score >= actualCost) {
            score -= actualCost;
            b.bought = true;
            recalculateRates();
            renderBusiness();
            updateUI();
            saveGame();
        }
    }

    function updateAvatar() {
        const index = (mellLevel - 1) % mellAvatars.length;
        mellImg.src = mellAvatars[index];
    }

    function updateUI() {
        scoreEl.innerText = Math.floor(score).toLocaleString() + ' 💰';
        cpsEl.innerText = autoCps;
        clickPowerEl.innerText = clickPower;

        document.getElementById('subs-count').innerText = Math.floor(subscribers).toLocaleString();
        document.getElementById('subs-cps').innerText = subsCps.toLocaleString();
        document.getElementById('dollars-count').innerText = Math.floor(dollars).toLocaleString() + ' $';

        document.getElementById('deposit-amount').innerText = Math.floor(bankDeposit).toLocaleString();
        document.getElementById('loan-amount').innerText = Math.floor(bankLoan).toLocaleString();

        if (bankLoan > 0 && loanEndTime > 0) {
            let leftSec = Math.max(0, Math.floor((loanEndTime - Date.now()) / 1000));
            document.getElementById('loan-timer-text').innerText = `Осталось времени на уплату: ${leftSec} сек.`;
            if (leftSec === 0) {
                score = Math.max(0, score - bankLoan);
                bankLoan = 0;
                loanEndTime = 0;
            }
        } else {
            document.getElementById('loan-timer-text').innerText = '';
        }

        renderShop();
        renderCrypto();
        renderBusiness();
    }

    // Сброс
    document.getElementById('reset-btn').onclick = () => {
        if (confirm("Вы точно хотите сбросить весь прогресс?")) {
            isResetting = true;
            localStorage.removeItem('mellstroy_clicker_v3');
            location.reload();
        }
    };

    // Старт
    loadGame();
    updateAvatar();
    updateUI();

    // Главный Таймер (каждую секунду)
    setInterval(() => {
        // Доход Бурмалды (только 1 авто-ферма)
        if (autoCps > 0) {
            score += autoCps;
        }

        // Доход Подписчиков (от бизнесов и предметов)
        if (subsCps > 0) {
            subscribers += subsCps;
        }

        // 30-секундный цикл
        cryptoTimer--;
        if (cryptoTimer <= 0) {
            cryptoTimer = 30;
            updateCryptoPrices();

            // Процент по вкладу
            if (bankDeposit > 0) {
                let depositBonusCount = shopItems.find(i => i.id === 'item3')?.count || 0;
                let rate = 1.05 + (depositBonusCount * 0.01);
                bankDeposit = Math.floor(bankDeposit * rate);
            }

            // Бесплатный доллар за ИИ-Менеджера
            let freeDollarCount = shopItems.find(i => i.id === 'item8')?.count || 0;
            if (freeDollarCount > 0) {
                dollars += freeDollarCount;
            }
        }
        document.getElementById('timer-info').innerText = `Крипта/Вклад через: ${cryptoTimer}s`;

        updateUI();
    }, 1000);

    setInterval(saveGame, 3000);
    window.addEventListener('beforeunload', saveGame);
</script>
</body>
</html>
